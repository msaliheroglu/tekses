name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (gateway, control-api, paketler)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEKSES_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  moderator:
    name: Moderatör paneli (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/moderator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/moderator/package-lock.json
      - run: npm ci
      - run: npm run build

  # Flutter analizi Faz 1'de eklenecek: bu depo platform iskeletini
  # (flutter create çıktısını) içermediği için önce o karar netleşmeli.
