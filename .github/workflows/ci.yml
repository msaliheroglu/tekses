name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go (gateway, loadgen, paketler)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  # Flutter analizi Faz 1'de eklenecek: bu depo platform iskeletini
  # (flutter create çıktısını) içermediği için önce o karar netleşmeli.
