name: tekses_participant
description: "TekSes katılımcı uygulaması — Faz 0 senkron denemesi: saat senkronu + zamanlanmış ekran/fener kue."
publish_to: "none"
version: 0.1.0

environment:
  # Color.withValues vb. için Flutter 3.27+ (Dart 3.6+) gerekir.
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Katılım + paket indirme (control-api).
  http: ^1.2.0
  # Paket SHA-256 doğrulaması.
  crypto: ^3.0.3
  # Ses varlıklarının indirildiği kalıcı uygulama dizini.
  path_provider: ^2.1.0
  # WebSocket istemcisi (gateway bağlantısı).
  web_socket_channel: ^3.0.0
  # Telefon feneri. Karar: zamanlanmış ses ve hassas fener Faz 2'de native
  # platform kanallarına taşınacak; Faz 0'da bu eklenti yeterli.
  torch_light: ^1.1.0
  # Gösteri boyunca ekranın açık kalması (yalnızca ön planda çalışma kararı).
  wakelock_plus: ^1.2.0
  # v2 ikili tel (F3.0): lib/gen altındaki üretilmiş stub'ların çalışma
  # zamanı. Stub üretimi: packages/proto/README.md (protoc_plugin + buf).
  # 6.x ŞART: stub'lar protoc_plugin 25.x ile üretildi ve 6.x çalışma zamanı
  # API'sini kullanır; 4.x ile analyze düşer. Stub'ları yeniden üretirsen
  # protoc_plugin ile protobuf sürümlerinin eş gittiğinden emin ol.
  protobuf: ^6.1.0
  fixnum: ^1.1.0
  # Ultrasonik beacon dinleyicisi: mikrofon PCM akışı (F2.7).
  # AndroidManifest'e RECORD_AUDIO, iOS'a NSMicrophoneUsageDescription gerekir.
  # 5.x KULLANILMAZ: o hat, arayüzle uyumsuz bir record_linux çekiyor ve
  # `flutter build apk` Dart derlemesinde patlıyor (analyze/test görmez —
  # platform gerçeklemeleri yalnızca derlemede ele alınır).
  record: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
