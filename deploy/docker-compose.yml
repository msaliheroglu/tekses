# TekSes pilot dağıtımı — tek VM, tek alan adı, otomatik TLS.
#
# Kullanım (deploy/ dizininde):
#   cp .env.example .env   # değerleri doldurun
#   docker compose up -d --build
#
# Caddy, ${TEKSES_DOMAIN} için Let's Encrypt sertifikasını kendisi alır;
# 80 ve 443 portları internete açık olmalıdır. Yol tablosu Caddyfile'dadır.

name: tekses

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
      POSTGRES_DB: tekses
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tekses"]
      interval: 5s
      timeout: 5s
      retries: 10

  control-api:
    build:
      context: ..
      dockerfile: services/control-api/Dockerfile
    restart: unless-stopped
    environment:
      TEKSES_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/tekses?sslmode=disable
      # Servisler arası iç uç sırrı (gateway → /internal/runs). Boş bırakılırsa
      # kalıcı Run kaydı kapalı kalır; eski .env'li kurulum kırılmaz.
      TEKSES_INTERNAL_TOKEN: ${TEKSES_INTERNAL_TOKEN:-}
    volumes:
      - packages:/data/packages
    depends_on:
      postgres:
        condition: service_healthy

  # Yayın dağıtım omurgası (F2.6): kue hangi gateway kopyasına gelirse
  # gelsin NATS üzerinden hepsine yayılır. Tek kopyada da zararsızdır.
  nats:
    image: nats:2-alpine
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    restart: unless-stopped
    # Çok düğüm: `docker compose up -d --scale gateway=2` — kopyalar aynı
    # NATS'e bağlanır; Caddy, Docker DNS üzerinden bağlantıları kopyalara
    # dağıtır (WebSocket bağlantı başına yapışkandır).
    # On binlerce eşzamanlı WebSocket = o kadar dosya tanıtıcısı; dağıtım
    # ortamının varsayılanına güvenilmez (yük testi ve etkinlik günü için).
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    environment:
      TEKSES_CONTROL_URL: http://control-api:8090
      TEKSES_NATS_URL: nats://nats:4222
      TEKSES_ADMIN_TOKEN: ${TEKSES_ADMIN_TOKEN:?TEKSES_ADMIN_TOKEN zorunlu (internete açık kurulumda konsol uçları korunmalı)}
      TEKSES_INTERNAL_TOKEN: ${TEKSES_INTERNAL_TOKEN:-}
    depends_on:
      - control-api
      - nats

  moderator:
    build:
      context: ../apps/moderator
      args:
        # QR'ların telefonlardan erişilen adresi (derlemeye gömülür).
        NEXT_PUBLIC_GATEWAY_PUBLIC_URL: https://${TEKSES_DOMAIN}
    restart: unless-stopped
    environment:
      CONTROL_API_URL: http://control-api:8090
      GATEWAY_URL: http://gateway:8080
    depends_on:
      - control-api
      - gateway

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TEKSES_DOMAIN: ${TEKSES_DOMAIN:?TEKSES_DOMAIN zorunlu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - moderator
      - gateway
      - control-api

volumes:
  pgdata:
  packages:
  caddy_data:
  caddy_config:
